<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body class="pagina-login">

  <main class="login-caja">
    <h1>Iniciar sesión</h1>

    <form id="formulario">

      <label for="usuario">Nombre de usuario</label>
      <input type="text" id="usuario" name="usuario" placeholder="Tu usuario" required>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" required>

      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="transicion.js"></script>
  <script>
    const formulario = document.getElementById("formulario");

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault(); // evita que la página se recargue sola

      const datos = {
        usuario: document.getElementById("usuario").value,
        correo: document.getElementById("correo").value
      };

      localStorage.setItem("datosUsuario", JSON.stringify(datos));

irA("index.html");
    });
  
  </script>

</body>
</html>
